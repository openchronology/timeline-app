services:
  database:
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
    environment:
      POSTGRES_USER: openchronology
      POSTGRES_DB: openchronology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - timelines:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openchronology -d openchronology']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env using the database service hostname}
    command: ['node', 'server/migrate.mjs']
    depends_on:
      database:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  timelines:
