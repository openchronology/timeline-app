# Docker Compose for a self-hosted server: PostgreSQL with pgmp, migrations and the web app,
# with optional seed data, mail worker and syslog receiver (docs/docker.md).
x-app-build: &app-build
  context: .
  dockerfile: deploy/Dockerfile.app
  args:
    OCH_BUILD_COMMIT: ${OCH_BUILD_COMMIT:-}
    OCH_BUILD_VERSION: ${OCH_BUILD_VERSION:-}

x-database-environment: &database-environment
  PGHOST: database
  PGPORT: 5432
  PGUSER: openchronology
  PGDATABASE: openchronology
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  database:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
    environment:
      POSTGRES_USER: openchronology
      POSTGRES_DB: openchronology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - timelines:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openchronology -d openchronology']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      DEFAULT_USER_STORAGE_BYTES: ${DEFAULT_USER_STORAGE_BYTES:-}
    command: ['node', 'server/migrate.mjs']
    depends_on:
      database:
        condition: service_healthy
  seed:
    profiles: ['seed']
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      SEED_MANAGER: ${SEED_MANAGER:-}
    command: ['node', 'server/seed.mjs']
    depends_on:
      migrate:
        condition: service_completed_successfully
  app:
    restart: unless-stopped
    init: true
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      ALLOW_INSECURE_ORIGIN: ${ALLOW_INSECURE_ORIGIN:-0}
      PLATFORM_NAME: ${PLATFORM_NAME:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      API_KEY_REQUESTS_PER_MINUTE: ${API_KEY_REQUESTS_PER_MINUTE:-120}
      FEATURED_TIMELINES: ${FEATURED_TIMELINES:-}
      DEFAULT_USER_STORAGE_BYTES: ${DEFAULT_USER_STORAGE_BYTES:-}
      TIMELINE_ENTRY_LIMIT: ${TIMELINE_ENTRY_LIMIT:-}
      TIMELINE_FILE_BYTES: ${TIMELINE_FILE_BYTES:-}
      EXPORT_CACHE: ${EXPORT_CACHE:-}
      EXPORT_CACHE_DIR: ${EXPORT_CACHE_DIR:-}
      EXPORT_CACHE_MAX_BYTES: ${EXPORT_CACHE_MAX_BYTES:-}
      EXPORT_CACHE_PUBLIC_URL: ${EXPORT_CACHE_PUBLIC_URL:-}
      EXPORT_CACHE_S3_ENDPOINT: ${EXPORT_CACHE_S3_ENDPOINT:-}
      EXPORT_CACHE_S3_REGION: ${EXPORT_CACHE_S3_REGION:-}
      EXPORT_CACHE_S3_BUCKET: ${EXPORT_CACHE_S3_BUCKET:-}
      EXPORT_CACHE_S3_PREFIX: ${EXPORT_CACHE_S3_PREFIX:-}
      EXPORT_CACHE_S3_ACCESS_KEY_ID: ${EXPORT_CACHE_S3_ACCESS_KEY_ID:-}
      EXPORT_CACHE_S3_SECRET_ACCESS_KEY: ${EXPORT_CACHE_S3_SECRET_ACCESS_KEY:-}
      EXPORT_CACHE_S3_PATH_STYLE: ${EXPORT_CACHE_S3_PATH_STYLE:-}
      COMPARE_TIMELINES_GUEST: ${COMPARE_TIMELINES_GUEST:-4}
      COMPARE_TIMELINES_USER: ${COMPARE_TIMELINES_USER:-8}
      COMPARE_TIMELINES_ADMIN: ${COMPARE_TIMELINES_ADMIN:-8}
      EMBED_FRAME_ANCESTORS: ${EMBED_FRAME_ANCESTORS:-*}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      CHALLENGE_PROVIDER: ${CHALLENGE_PROVIDER:-pow}
      CHALLENGE_DIFFICULTY: ${CHALLENGE_DIFFICULTY:-150000}
      CHALLENGE_TRUST_DAYS: ${CHALLENGE_TRUST_DAYS:-7}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PLUGIN_LIBRARY: ${PLUGIN_LIBRARY:-}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_GRAPH_VERSION: ${OAUTH_FACEBOOK_GRAPH_VERSION:-}
      OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-}
      OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-}
      OAUTH_FACEBOOK_ENABLED: ${OAUTH_FACEBOOK_ENABLED:-}
      OAUTH_MICROSOFT_ENABLED: ${OAUTH_MICROSOFT_ENABLED:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-}
      OAUTH_MICROSOFT_LABEL: ${OAUTH_MICROSOFT_LABEL:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-}
      LDAP_TLS_CA: ${LDAP_TLS_CA:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-}
      LDAP_REQUIRED_GROUP: ${LDAP_REQUIRED_GROUP:-}
      LDAP_NESTED_GROUPS: ${LDAP_NESTED_GROUPS:-}
      LDAP_LABEL: ${LDAP_LABEL:-}
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      migrate:
        condition: service_completed_successfully
  mail-worker:
    profiles: ['mail']
    restart: unless-stopped
    init: true
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    command: ['node', 'server/mail-worker.mjs']
    depends_on:
      migrate:
        condition: service_completed_successfully
  # Optional syslog receiver (docs/syslog.md): docker compose --profile syslog up -d
  syslog:
    profiles: ['syslog']
    restart: unless-stopped
    init: true
    image: openchronology-app:local
    build: *app-build
    environment:
      OCH_API_URL: ${SYSLOG_API_URL:-http://app:5173}
      OCH_API_KEY: ${SYSLOG_API_KEY:-}
      SYSLOG_ROUTES: /config/syslog-routes.json
      SYSLOG_HOST: 0.0.0.0
      SYSLOG_PORT: 5514
      SYSLOG_TIMEZONE: ${SYSLOG_TIMEZONE:-UTC}
    volumes:
      - ${SYSLOG_ROUTES_FILE:-./syslog-routes.json}:/config/syslog-routes.json:ro
    # Loopback only, like the app; publish more widely only behind a firewall.
    ports:
      - '127.0.0.1:${SYSLOG_HOST_PORT:-5514}:5514/udp'
      - '127.0.0.1:${SYSLOG_HOST_PORT:-5514}:5514/tcp'
    command: ['node', 'server/syslog-receiver.mjs']
    depends_on:
      app:
        condition: service_started
volumes:
  timelines:
