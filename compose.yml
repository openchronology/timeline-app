x-app-build: &app-build
  context: .
  dockerfile: deploy/Dockerfile.app
  args:
    OCH_BUILD_COMMIT: ${OCH_BUILD_COMMIT:-}
    OCH_BUILD_VERSION: ${OCH_BUILD_VERSION:-}

x-database-environment: &database-environment
  PGHOST: database
  PGPORT: 5432
  PGUSER: openchronology
  PGDATABASE: openchronology
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  database:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
    environment:
      POSTGRES_USER: openchronology
      POSTGRES_DB: openchronology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - timelines:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openchronology -d openchronology']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      DEFAULT_USER_STORAGE_BYTES: ${DEFAULT_USER_STORAGE_BYTES:-104857600}
    command: ['node', 'server/migrate.mjs']
    depends_on:
      database:
        condition: service_healthy
  seed:
    profiles: ['seed']
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      SEED_MANAGER: ${SEED_MANAGER:-}
    command: ['node', 'server/seed.mjs']
    depends_on:
      migrate:
        condition: service_completed_successfully
  app:
    restart: unless-stopped
    init: true
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      API_KEY_REQUESTS_PER_MINUTE: ${API_KEY_REQUESTS_PER_MINUTE:-120}
      FEATURED_TIMELINES: ${FEATURED_TIMELINES:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PLUGIN_LIBRARY: ${PLUGIN_LIBRARY:-}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_GRAPH_VERSION: ${OAUTH_FACEBOOK_GRAPH_VERSION:-}
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      migrate:
        condition: service_completed_successfully
  mail-worker:
    profiles: ['mail']
    restart: unless-stopped
    init: true
    image: openchronology-app:local
    build: *app-build
    environment:
      <<: *database-environment
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    command: ['node', 'server/mail-worker.mjs']
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  timelines:
