name: Tagged release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ github.event.release.tag_name || github.ref_name }}
  server:
    uses: ./.github/workflows/server-packages.yml
    with:
      tag: ${{ github.event.release.tag_name || github.ref_name }}
  web:
    name: Offline HTML and matching source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve immutable release identity
        run: |
          node --input-type=module -e 'import {releaseVersion} from "./scripts/build-info.mjs"; if(!releaseVersion.test(process.env.RELEASE_TAG)) throw Error("Use a semantic version tag, such as v1.2.3");'
          echo "OCH_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OCH_BUILD_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          rustup update stable --no-self-update
          rustup default stable
      - run: node scripts/npm-ci.mjs
      - run: npm run typecheck
      - run: npm run build:offline
      - run: npm test
      - run: npm run build
      - run: npm run test:platform
      - run: npm run build:source:desktop
      - name: Stage web release files
        run: |
          mkdir release-assets
          cp dist/openchronology-offline.html dist/openchronology-web-source.tar.gz dist/openchronology-desktop-source.tar.gz dist/build-info.json release-assets/
          cp LICENSE release-assets/LICENSE.txt
          cp NOTICE release-assets/NOTICE.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: release-assets/
          if-no-files-found: error
  publish:
    name: Publish all runner-built release targets
    needs: [desktop, server, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          path: release-assets/
          merge-multiple: true
      - name: Validate complete release and calculate checksums
        run: node scripts/release-assets.mjs "$RELEASE_TAG"
      - name: Attach runner-built assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
  # Stable releases publish the Homebrew formula (#116) to openchronology/homebrew-tap, for the
  # platform archive this release attached; pre-releases leave the tap as it is.
  homebrew:
    name: Publish the Homebrew formula
    needs: publish
    if: ${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Render the formula for this release's platform archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --pattern openchronology-server-platform.tar.gz --dir release
          node scripts/homebrew-formula.mjs \
            --tarball release/openchronology-server-platform.tar.gz \
            --url "https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/openchronology-server-platform.tar.gz" \
            --out openchronology-server.rb
      - name: Push it to the tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 0600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone git@github.com:openchronology/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp openchronology-server.rb tap/Formula/
          cp deploy/homebrew/tap-README.md tap/README.md
          cd tap
          git add Formula/openchronology-server.rb README.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="OpenChronology releases" -c user.email="releases@openchronology.invalid" \
            commit -m "openchronology-server ${RELEASE_TAG#v}"
          git push origin HEAD:main
