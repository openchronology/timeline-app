name: Tagged release
# A version tag or published release: builds the desktop and server packages, the offline HTML
# and matching source, checks every asset (scripts/release-assets.mjs), attests their build
# provenance and attaches them, then publishes the Homebrew formula and the AUR packages for a
# stable release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ github.event.release.tag_name || github.ref_name }}
  server:
    uses: ./.github/workflows/server-packages.yml
    with:
      tag: ${{ github.event.release.tag_name || github.ref_name }}
  # The Nix flake built at the tag, and written to the binary cache when one is configured.
  nix:
    uses: ./.github/workflows/nix.yml
    with:
      push: true
    secrets: inherit
  web:
    name: Offline HTML and matching source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve immutable release identity
        run: |
          node --input-type=module -e 'import {releaseVersion} from "./scripts/build-info.mjs"; if(!releaseVersion.test(process.env.RELEASE_TAG)) throw Error("Use a semantic version tag, such as v1.2.3");'
          echo "OCH_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OCH_BUILD_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
      - run: node scripts/npm-ci.mjs
      - run: npm run typecheck
      - run: npm run build:offline
      - run: npm test
      - run: npm run build
      - run: npm run test:platform
      - run: npm run build:source:desktop
      - name: Stage web release files
        run: |
          mkdir release-assets
          cp dist/openchronology-offline.html dist/openchronology-offline-*.html dist/openchronology-web-source.tar.gz dist/openchronology-desktop-source.tar.gz dist/build-info.json release-assets/
          cp LICENSE release-assets/LICENSE.txt
          cp NOTICE release-assets/NOTICE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: release-assets/
          if-no-files-found: error
  # GitHub's signed record that each asset was built by this workflow from the tag's commit
  # (docs/licensing.md#verifying-a-download): gh attestation verify checks a download against it.
  # Only this job may request the signing identity and write attestations.
  attest:
    name: Attest the release assets' build provenance
    needs: [desktop, server, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          path: release-assets/
          merge-multiple: true
      - name: Validate complete release and calculate checksums
        run: node scripts/release-assets.mjs "$RELEASE_TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'
  publish:
    name: Publish all runner-built release targets
    needs: [desktop, server, web, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          path: release-assets/
          merge-multiple: true
      - name: Validate complete release and calculate checksums
        run: node scripts/release-assets.mjs "$RELEASE_TAG"
      - name: Attach runner-built assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
  # Stable releases publish the Homebrew formula (#116) to openchronology/homebrew-tap, for the
  # platform archive this release attached; pre-releases leave the tap as it is.
  homebrew:
    name: Publish the Homebrew formula
    needs: publish
    if: ${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Render the formula for this release's platform archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --pattern openchronology-server-platform.tar.gz --dir release
          node scripts/homebrew-formula.mjs \
            --tarball release/openchronology-server-platform.tar.gz \
            --url "https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/openchronology-server-platform.tar.gz" \
            --out openchronology-server.rb
      - name: Push it to the tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 0600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone git@github.com:openchronology/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp openchronology-server.rb tap/Formula/
          cp deploy/homebrew/tap-README.md tap/README.md
          cd tap
          git add Formula/openchronology-server.rb README.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="OpenChronology releases" -c user.email="releases@openchronology.invalid" \
            commit -m "openchronology-server ${RELEASE_TAG#v}"
          git push origin HEAD:main
  # Stable releases publish the offline editor to openchronology.github.io (#510), built at the
  # tag, so the hosted copy is a release's, never unreleased changes on main. Called from here
  # because a release published with this workflow's token starts no other workflow.
  pages:
    name: Publish the offline editor to openchronology.github.io
    needs: publish
    if: ${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.event.release.tag_name || github.ref_name }}
    secrets:
      PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
  # Stable releases publish the AUR packages (#331), openchronology-server and
  # openchronology-desktop-bin, for the platform archive and desktop .deb this release attached,
  # once AUR_SSH_KEY holds the private key of an AUR account that may push them (the first
  # push creates each package). Without it the job says so and publishes nothing.
  aur:
    name: Publish the AUR packages
    needs: publish
    if: ${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Render the packages for this release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --dir release \
            --pattern openchronology-server-platform.tar.gz \
            --pattern openchronology-desktop-linux-amd64.deb
          base="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          node scripts/aur-packages.mjs --out aur \
            --platform release/openchronology-server-platform.tar.gz \
            --platform-url "$base/openchronology-server-platform.tar.gz" \
            --desktop release/openchronology-desktop-linux-amd64.deb \
            --desktop-url "$base/openchronology-desktop-linux-amd64.deb"
      # The AUR reads each package's .SRCINFO, which makepkg writes from its PKGBUILD.
      - name: Write each .SRCINFO with makepkg
        run: |
          docker run --rm -v "$PWD/aur:/aur" archlinux:latest bash -euc '
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            for dir in /aur/*/; do
              chown -R builder "$dir"
              (cd "$dir" && runuser -u builder -- makepkg --printsrcinfo) > "$dir/.SRCINFO"
            done
            chmod -R a+rwX /aur'
      - name: Push them to the AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::AUR_SSH_KEY is not set: the AUR packages were not published."
            exit 0
          fi
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 0600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          for dir in aur/*/; do
            name=$(basename "$dir")
            git clone "ssh://aur@aur.archlinux.org/${name}.git" "repo-$name"
            find "repo-$name" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$dir/." "repo-$name/"
            git -C "repo-$name" add -A
            if git -C "repo-$name" diff --cached --quiet; then continue; fi
            git -C "repo-$name" -c user.name="OpenChronology releases" \
              -c user.email="releases@openchronology.invalid" \
              commit -m "${name} ${RELEASE_TAG#v}"
            git -C "repo-$name" push origin HEAD:master
          done
