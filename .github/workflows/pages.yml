name: Offline editor on openchronology.github.io
# Each stable release (#510): builds the standalone offline editor at the release's tag, checks it
# works without a network, and publishes it as openchronology.github.io's index page, and each
# edition (#197) at openchronology.github.io/<edition>/, such as /cfam/. release.yml calls it
# once a stable release is published; pushes to main and pre-releases are not published, so the
# hosted copy is always a release's. Run by hand, it publishes the release tag it is given.
on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, such as v1.2.3
        required: true
        type: string
    secrets:
      PAGES_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v1.2.3
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    name: Build and publish standalone offline HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # A release's tag only, and the file says which release it is, as the release's own does.
      - name: Resolve the release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'import {releaseVersion} from "./scripts/build-info.mjs"; if(!releaseVersion.test(process.env.RELEASE_TAG)) throw Error("Use a release tag, such as v1.2.3");'
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null || { echo "No tag $RELEASE_TAG"; exit 1; }
          echo "OCH_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OCH_BUILD_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
      - run: node scripts/npm-ci.mjs
      - run: npm run typecheck
      - run: npm run build:editor
      - run: npm run build:offline
      # Chromium's system packages, from Ubuntu's archive; a slow one fails this step on its
      # own (#351).
      - run: |
          sh scripts/ubuntu-archive.sh
          npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Verify the file works without a network
        run: npm run test:offline:browser
      # The organization site serves its default branch directly; a write deploy key scoped to that
      # repository (secret PAGES_DEPLOY_KEY) lets this workflow replace only its index page.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openchronology/openchronology.github.io
          ref: master
          path: site
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
      - name: Publish to openchronology.github.io
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp dist/openchronology-offline.html site/index.html
          published=index.html
          for file in dist/openchronology-offline-*.html; do
            edition=${file#dist/openchronology-offline-}
            edition=${edition%.html}
            mkdir -p "site/$edition"
            cp "$file" "site/$edition/index.html"
            published="$published $edition/index.html"
          done
          cd site
          git add $published
          if git diff --cached --quiet; then
            echo "The published offline editors are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish offline editor ${RELEASE_TAG} from openchronology/timeline-app@${OCH_BUILD_COMMIT}"
          git push origin HEAD:master
