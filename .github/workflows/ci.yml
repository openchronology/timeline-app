name: OpenChronology
# Every push and pull request: the Docker Compose stack; types and tests with npm, pnpm and
# Yarn on Node 22 and 24; the platform in Chromium, Firefox and WebKit; PostgreSQL with pgmp
# and the live-browser suites; UI capacity advice and budgets; and the desktop and server
# packages (desktop.yml, server-packages.yml).
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    name: Docker Compose / pgmp and web server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: openchronology-ci
      POSTGRES_PASSWORD: ci-only-password-with-punctuation-!@
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build and start the suite
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify native pgmp and bounded rational queries
        run: |
          docker compose exec -T database psql -X -U openchronology -d openchronology -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF '1/3'::mpq + '1/6'::mpq <> '1/2'::mpq THEN
              RAISE EXCEPTION 'Incorrect rational arithmetic';
            END IF;
            IF (SELECT count(*) FROM (VALUES ('-1/3'::mpq), ('1/3'::mpq), ('2/3'::mpq)) AS events(time)
                WHERE time BETWEEN '0'::mpq AND '1/2'::mpq) <> 1 THEN
              RAISE EXCEPTION 'Incorrect bounded rational query';
            END IF;
          END $$;
          SQL
      - run: node test/docker-smoke.mjs
      - name: Verify the SQLite converter inside the web image
        run: docker compose run --rm --no-deps --volume "$PWD/test:/app/test:ro" app node test/files.mjs
      - name: Verify the log importer command inside the web image
        run: |
          printf 'Oct  9 08:15:01 host sshd[1]: Accepted\n' > "$RUNNER_TEMP/syslog"
          docker compose run --rm --no-deps --volume "$RUNNER_TEMP:/logs:ro" app \
            och-import-logs --format syslog --timezone UTC --year 2026 --dry-run --quiet /logs/syslog \
            | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); if (p.entries !== 1) process.exit(1)'
      - name: Verify migrations can run again
        run: |
          docker compose run --rm migrate
          node test/docker-smoke.mjs
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
  core:
    name: Core / ${{ matrix.manager }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    # Usually about a minute; a hung test fails here rather than after GitHub's six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        manager: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pnpm
        if: matrix.manager == 'pnpm'
        run: |
          npm install --global --prefix "$RUNNER_TEMP/package-managers" pnpm@11.26.0
          echo "$RUNNER_TEMP/package-managers/bin" >> "$GITHUB_PATH"
      - name: Install Yarn
        if: matrix.manager == 'yarn'
        run: |
          npm install --global --prefix "$RUNNER_TEMP/package-managers" @yarnpkg/cli-dist@4.10.3
          echo "$RUNNER_TEMP/package-managers/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        env:
          PACKAGE_MANAGER: ${{ matrix.manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) node scripts/npm-ci.mjs ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
          esac
      - name: Check types and test both builds
        env:
          PACKAGE_MANAGER: ${{ matrix.manager }}
        run: |
          "$PACKAGE_MANAGER" run typecheck
          "$PACKAGE_MANAGER" run build:offline
          "$PACKAGE_MANAGER" run test
          "$PACKAGE_MANAGER" run build
          "$PACKAGE_MANAGER" run test:platform
          case "$PACKAGE_MANAGER" in
            npm) node node_modules/@tauri-apps/cli/tauri.js --version ;;
            *) "$PACKAGE_MANAGER" exec tauri --version ;;
          esac
          git diff --exit-code -- package.json package-lock.json pnpm-lock.yaml yarn.lock
      - name: Package matching web source
        if: matrix.node == 24 && matrix.manager == 'npm'
        run: npm run build:source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == 24 && matrix.manager == 'npm'
        with:
          name: openchronology-offline-html
          path: |
            dist/openchronology-offline.html
            dist/openchronology-offline-*.html
            dist/openchronology-web-source.tar.gz
          if-no-files-found: error
  browser:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    # Usually five to eight minutes; a hung test fails here rather than after GitHub's six hours.
    timeout-minutes: 30
    # Playwright's image has the browsers and their system packages, so no apt step depends on
    # the runner's Ubuntu mirror: WebKit's ~130 packages outlasted the job when it was slow
    # (#351). Its version follows the playwright package's.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      # Firefox will not start as root with another user's home.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/npm-ci.mjs
      # Nothing to do while the image matches the package; downloads only the browser if not.
      - run: npx playwright install "$BROWSER"
        timeout-minutes: 5
        env:
          BROWSER: ${{ matrix.browser }}
      - run: npm run build
      - name: Next.js platform browser integration
        run: npm run test:platform
        env:
          PLATFORM_BROWSER_TEST: '1'
          BROWSER: ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
      - run: npm run test:offline:browser
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
  # The browser's capacity advice (src/capacity.ts, docs/capacity.md): within the comfortable
  # sizes every interaction meets its budget, and just past them the advice is showing
  # wherever one misses. The browser at full speed, comfortable up to 10,000 moments, is
  # gated in the PostgreSQL job with the platform.
  ui-capacity:
    name: UI capacity advice
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # In Playwright's image, as the browser jobs are (#351).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/npm-ci.mjs
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run build:editor
      # A slow device (CPU throttled 4×) at its comfortable size.
      - name: Slow device, comfortable size
        run: node bench/ui.mjs --gate
        env:
          UI_PLATFORMS: browser
          UI_THROTTLES: '4'
          UI_SIZES: '1000'
          UI_SAMPLES: '3'
      - name: Past the comfortable size, at full speed
        run: node bench/ui.mjs --gate
        env:
          UI_PLATFORMS: browser
          UI_THROTTLES: '1'
          UI_SIZES: '20000'
          UI_SAMPLES: '3'
      - name: Past the comfortable size, on a slow device
        run: node bench/ui.mjs --gate
        env:
          UI_PLATFORMS: browser
          UI_THROTTLES: '4'
          UI_SIZES: '2000'
          UI_SAMPLES: '3'
  postgres:
    name: PostgreSQL 16 / native pgmp / accounts and sharing
    runs-on: ubuntu-24.04
    # Usually about twelve minutes; a hung test fails here rather than after GitHub's six hours.
    timeout-minutes: 40
    env:
      PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGUSER: rational_test
      PGDATABASE: rational_app
      DATABASE_URL: postgresql://rational_test@127.0.0.1:5433/rational_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dvarrazzo/pgmp
          ref: 1849585416f2bc3d070bf8cef6a659907687ec7f
          path: upstream/pgmp
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL and native build dependencies
        run: |
          sh scripts/ubuntu-archive.sh
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16 libgmp-dev libsqlite3-dev build-essential cmake python3
          "$PG_CONFIG" --bindir >> "$GITHUB_PATH"
          echo "PGDATA=$RUNNER_TEMP/openchronology-postgres" >> "$GITHUB_ENV"
      - name: Build and install real pgmp
        working-directory: upstream/pgmp
        run: |
          python3 tools/unmix.py < sql/pgmp.pysql > sql/pgmp--1.1.sql
          python3 tools/sql2extension.py --extname pgmp sql/pgmp--1.1.sql > sql/pgmp--unpackaged--1.1.sql
          make PG_CONFIG="$PG_CONFIG" with_llvm=no -j2
          sudo make PG_CONFIG="$PG_CONFIG" with_llvm=no install
      - name: Start an isolated PostgreSQL instance
        run: |
          initdb -D "$PGDATA" -U "$PGUSER" --auth=trust
          pg_ctl -D "$PGDATA" -l "$RUNNER_TEMP/openchronology-postgres.log" -o "-p $PGPORT -h 127.0.0.1 -k $RUNNER_TEMP" -w start
          createdb "$PGDATABASE"
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgmp;'
      - run: node scripts/npm-ci.mjs
      - run: npm run build
      - run: node test/sql-oracle.mjs
      - name: Build the isolated SQLite file converter
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo build --manifest-path native-store/Cargo.toml --locked --release --bin och-convert
      - run: node test/files.mjs
      - run: node test/durations-postgres.mjs
      - run: node test/search-postgres.mjs
      - run: node test/summaries-postgres.mjs
      - run: node test/views-postgres.mjs
      - run: node test/relationships-postgres.mjs
      - run: node test/incremental-postgres.mjs
      - run: node test/tree-paths-postgres.mjs
      - run: node test/catalogue-text-postgres.mjs
      - run: node test/document-stream-postgres.mjs
      - run: node test/export-cache-postgres.mjs
      - run: node test/history-postgres.mjs
      - run: node test/shared-history-postgres.mjs
      - run: node test/optional-history-postgres.mjs
      - run: node test/pull-history-postgres.mjs
      - run: node test/merge-postgres.mjs
      - run: node test/statistics-postgres.mjs
      - run: node test/fork-preparing-postgres.mjs
      - run: node test/fork-read-through-postgres.mjs
      - run: node test/index-cleanup-postgres.mjs
      - run: node test/index-versions-postgres.mjs
      - run: node test/retention-postgres.mjs
      - run: node test/summaries-equivalence-postgres.mjs
      - run: node test/log-import-postgres.mjs
      - run: node test/stars-postgres.mjs
      - run: node test/follow-postgres.mjs
      - run: node test/administration-postgres.mjs
      - run: node test/limits-postgres.mjs
      - run: node test/admin-reset-postgres.mjs
      - run: node test/account-security-postgres.mjs
      - run: node test/passkeys-postgres.mjs
      # Directory sign-in against an OpenLDAP container the test starts (Docker is on the runner).
      - run: node test/ldap-postgres.mjs
        env:
          LDAP_TEST_REQUIRED: '1'
      - run: node test/microsoft-postgres.mjs
      - run: node test/challenge-postgres.mjs
      - run: node test/moderation-postgres.mjs
      - run: node test/standing-postgres.mjs
      - run: node test/save-merge-postgres.mjs
      - run: node test/labels-postgres.mjs
      - run: node test/ages-postgres.mjs
      - run: node test/image-links-postgres.mjs
      - run: node test/timeline-image-postgres.mjs
      - run: node test/deletion-postgres.mjs
      - run: node test/time-map-postgres.mjs
      - run: node test/openapi-postgres.mjs
      # As root, so the system journal is readable whatever the runner's groups.
      - name: Following the systemd journal
        run: sudo -E env "PATH=$PATH" node test/journald-live-postgres.mjs
      - run: npm run test:postgres
      - run: npm run test:platform:postgres
      # Chromium's system packages come from Ubuntu's archive; when it is slow, this fails on
      # its own rather than taking the job's whole budget (#351).
      - name: Chromium and its system packages
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Realtime syslog timelines in a live browser
        run: node test/syslog-live-postgres.mjs
      - name: Sharing, link previews and embeds in a live browser
        run: node test/sharing-postgres.mjs
      - name: Reports and moderation in a live browser
        run: node test/moderation-live-postgres.mjs
      - name: Agreeing to the terms in a live browser
        run: node test/terms-live-postgres.mjs
      - name: Passkeys in a live browser
        run: node test/passkeys-live-postgres.mjs
      - name: Searching and browsing timelines in a live browser
        run: node test/timeline-browser-live-postgres.mjs
      - name: The landing page and audience pages in a live browser
        run: node test/landing-live-postgres.mjs
      - name: Light and dark themes in a live browser
        run: node test/theme-live-postgres.mjs
      - name: Saving while others save, in a live browser
        run: node test/save-merge-live-postgres.mjs
      - name: Sensitive-content labels in a live browser
        run: node test/labels-live-postgres.mjs
      - name: Deleting comments and accounts in a live browser
        run: node test/deletion-live-postgres.mjs
      - name: Shifting and scaling times in a live browser
        run: node test/time-map-live-postgres.mjs
      # Interactions within the budgets in src/capacity.ts: the browser (comfortable up to
      # 10,000 moments) and the platform (up to the limit) at 1,000 and 10,000.
      - name: UI interactions within budget
        run: node bench/ui.mjs --gate
        env:
          UI_SIZES: '1000,10000'
          UI_THROTTLES: '1'
          UI_SAMPLES: '3'
      - run: npm run test:versioning:postgres
      - run: node test/seed-postgres.mjs
      - run: node test/browser-fork-postgres.mjs
      - run: node test/comparison-live-postgres.mjs
      - name: Stop PostgreSQL
        if: always()
        run: |
          if test -f "$PGDATA/postmaster.pid"; then pg_ctl -D "$PGDATA" -m fast -w stop; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: postgres-log
          path: ${{ runner.temp }}/openchronology-postgres.log
  desktop:
    name: Desktop packages
    uses: ./.github/workflows/desktop.yml
  # The server .deb for each distribution: on every push (so main always has them as
  # artifacts) and pull request.
  server:
    name: Server packages
    uses: ./.github/workflows/server-packages.yml
  desktop-ui:
    name: Desktop app / UI interactions within budget
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Desktop build dependencies, WebKitWebDriver and a virtual display
        run: |
          sh scripts/ubuntu-archive.sh
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgmp-dev libsqlite3-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: Stable Rust and tauri-driver
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo install tauri-driver --locked
      - run: node scripts/npm-ci.mjs
      - run: npm run build:editor
      # A debug app with the editor embedded (no installer packages).
      - run: npx tauri build --debug --no-bundle
      # Changes made at once to a large desktop file, in its native store (#179).
      # Usually under a minute; the step limit backs up the WebDriver requests' own (#205).
      - name: Desktop bulk edits
        timeout-minutes: 5
        run: xvfb-run -a node test/desktop-bulk.mjs
      # 1,000 moments stay in memory; 10,000 move into the native SQLite store. Navigation and
      # new durations are reported, not gated: under Xvfb they render in software, varying
      # severalfold between runners, and WebKitWebDriver now and then loses a wheel or key
      # input, so the view never changes. Everything else must meet its budget.
      # Usually about 3 minutes; the step limit backs up the WebDriver requests' own (#205).
      - name: UI interactions within budget
        timeout-minutes: 15
        run: xvfb-run -a node bench/ui.mjs --gate
        env:
          UI_PLATFORMS: desktop
          UI_SIZES: '1000,10000'
          UI_SAMPLES: '3'
          UI_KNOWN: navigation,new-duration
          # Software rendering on shared runners is slow and varies widely: opening search took
          # 96 ms on a laptop and 140-173 ms here. The desktop gate guards against breakage
          # (an interaction that fails or never finishes) and gross regressions.
          UI_TOLERANCE: '3'
          UI_DEBUG: '1'
