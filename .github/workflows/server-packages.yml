name: Server packages
# Builds the server package for each distribution (scripts/server-package.mjs): .deb for
# Debian and Ubuntu, .rpm for Rocky/RHEL and Fedora. Each is installed in a fresh container of
# its distribution (test/server-deb.mjs, test/server-rpm.mjs) and uploaded.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    name: Server / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: debian13, format: deb }
          - { target: ubuntu24.04, format: deb }
          - { target: rocky10, format: rpm }
          - { target: fedora44, format: rpm }
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          # The build identity and development versions read the commit and its tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the package
        run: node scripts/server-package.mjs "${{ matrix.target }}"
      - name: Install, run, upgrade and remove it in a fresh container
        run: node "test/server-${{ matrix.format }}.mjs" "server-artifacts/openchronology-server-${{ matrix.target }}-amd64.${{ matrix.format }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.target }}
          path: server-artifacts/openchronology-server-${{ matrix.target }}-amd64.${{ matrix.format }}
          if-no-files-found: error
