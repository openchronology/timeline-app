name: Server packages
# Builds the server package for each distribution (scripts/server-package.mjs): .deb for
# Debian and Ubuntu, .rpm for Rocky/RHEL and Fedora. Each is installed in a fresh container of
# its distribution (test/server-deb.mjs, test/server-rpm.mjs) and uploaded. From the
# platform archive it also builds and tests the FreeBSD packages, the Homebrew formula on
# macOS and the Windows installer. Called by ci.yml and release.yml.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    name: Server / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: debian13, format: deb }
          - { target: ubuntu24.04, format: deb }
          - { target: rocky10, format: rpm }
          - { target: fedora44, format: rpm }
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          # The build identity and development versions read the commit and its tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the package
        timeout-minutes: 15
        run: node scripts/server-package.mjs "${{ matrix.target }}"
      - name: Install, run, upgrade and remove it in a fresh container
        timeout-minutes: 10
        run: node "test/server-${{ matrix.format }}.mjs" "server-artifacts/openchronology-server-${{ matrix.target }}-amd64.${{ matrix.format }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.target }}
          path: server-artifacts/openchronology-server-${{ matrix.target }}-amd64.${{ matrix.format }}
          if-no-files-found: error
  # The server's platform-independent part (deploy/platform), built once: FreeBSD's packages
  # and Homebrew's formula build from it, and releases attach it.
  platform:
    name: Server / platform
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the platform
        timeout-minutes: 10
        run: node scripts/server-package.mjs platform
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-platform
          path: server-artifacts/openchronology-server-platform.tar.gz
          if-no-files-found: error
  # FreeBSD (#116): a FreeBSD virtual machine builds och-convert and pgmp from the platform and
  # makes the package (deploy/freebsd-server/build.sh).
  freebsd:
    name: Server / ${{ matrix.target }}
    needs: platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: freebsd14, release: '14' }
          - { target: freebsd15, release: '15' }
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: server-platform
          path: server-artifacts/
      - name: Prepare the FreeBSD build
        run: node scripts/server-package.mjs "${{ matrix.target }}"
      - name: Build the package on FreeBSD ${{ matrix.release }}
        timeout-minutes: 15
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: ${{ matrix.release }}
          usesh: true
          cpu: 4
          mem: 8192
          sync: rsync
          copyback: true
          run: sh deploy/freebsd-server/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.target }}
          path: server-artifacts/openchronology-server-${{ matrix.target }}-amd64.pkg
          if-no-files-found: error
  # A fresh FreeBSD system installs it as the README says, and runs it.
  freebsd-test:
    name: Server / ${{ matrix.target }} install
    needs: freebsd
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: freebsd14, release: '14' }
          - { target: freebsd15, release: '15' }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: server-${{ matrix.target }}
          path: server-artifacts/
      - name: Install, run, upgrade and remove it on FreeBSD ${{ matrix.release }}
        timeout-minutes: 15
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: ${{ matrix.release }}
          usesh: true
          cpu: 2
          mem: 4096
          sync: rsync
          copyback: false
          # Node.js runs the test; the package brings the rest.
          prepare: env ASSUME_ALWAYS_YES=yes pkg install -y node24
          run: node test/server-freebsd.mjs server-artifacts/openchronology-server-${{ matrix.target }}-amd64.pkg
  # macOS (#116): Homebrew installs the formula (deploy/homebrew) from a local tap, building
  # och-convert and pgmp from the platform, and the server is set up and checked.
  macos:
    name: Server / macos
    needs: platform
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: server-platform
          path: server-artifacts/
      - name: Tap the formula locally
        run: |
          brew tap-new --no-git openchronology/local
          tap="$(brew --repository openchronology/local)"
          node scripts/homebrew-formula.mjs \
            --tarball server-artifacts/openchronology-server-platform.tar.gz \
            --url "file://$PWD/server-artifacts/openchronology-server-platform.tar.gz" \
            --out "$tap/Formula/openchronology-server.rb"
      # A PostgreSQL the runner may run already would hold the socket PostgreSQL 17 needs.
      - name: Stop other PostgreSQL servers
        run: brew services list | awk '/^postgresql/ {print $1}' | xargs -n1 brew services stop || true
      - name: Install it as users do
        timeout-minutes: 10
        run: brew install --build-from-source openchronology/local/openchronology-server
      - run: brew test openchronology/local/openchronology-server
      - name: Set it up, run it and remove it
        timeout-minutes: 5
        run: node test/server-homebrew.mjs
  # Windows (#116): the self-contained installer, with its own PostgreSQL 17 and pgmp built for
  # it with MSVC, built from the platform and installed, run, upgraded and removed unattended.
  windows:
    name: Server / windows
    needs: platform
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: server-platform
          path: server-artifacts/
      # GMP and SQLite for MSVC, as the desktop's Windows build has them.
      - name: Cache pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/och-vcpkg-cache
          key: vcpkg-windows-amd64-${{ hashFiles('scripts/desktop/*-dependencies.*', 'scripts/desktop/triplets/**') }}
      - name: Native dependencies
        shell: pwsh
        run: ./scripts/desktop/windows-dependencies.ps1
      # NSIS from this cache, else the pinned release, with Chocolatey only as a last resort,
      # so an outage of one feed doesn't fail the build (#225).
      - name: Cache NSIS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nsis
          key: nsis-windows-${{ hashFiles('deploy/windows-server/nsis.ps1') }}
      - name: Stable Rust and NSIS
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          ./deploy/windows-server/nsis.ps1 -Destination "${{ runner.temp }}/nsis"
      - name: Build the installer
        timeout-minutes: 15
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { 'dev-' + (git rev-parse --short=7 HEAD) }
          ./deploy/windows-server/build.ps1 -Version $version
      - name: Install, run, upgrade and remove it
        timeout-minutes: 10
        run: node test/server-windows.mjs server-artifacts/openchronology-server-windows-amd64-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-windows
          path: server-artifacts/openchronology-server-windows-amd64-setup.exe
          if-no-files-found: error
