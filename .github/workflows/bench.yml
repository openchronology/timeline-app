name: Benchmarks

# Manually triggered: hosted runners are noisy, so these numbers show trends between
# backends and sizes rather than absolute latencies. See docs/benchmarks.md.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: Timeline sizes in moments (1 to 200000), separated by commas or spaces
        default: '1000,10000,50000,100000,200000'
      time:
        description: Measurement time per operation and size (ms)
        default: '1000'

permissions:
  contents: read

jobs:
  # The published PostgreSQL CI image (deploy/postgres-ci, #605), as ci.yml's PostgreSQL job
  # uses. This workflow doesn't build it: build-images.yml publishes it from main.
  image:
    name: PostgreSQL CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.find.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Sign in to GitHub's container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Find the published image
        id: find
        run: |
          node scripts/build-images.mjs --find postgres-ci >> "$GITHUB_OUTPUT"
          grep -q '^image=.' "$GITHUB_OUTPUT" || { echo '::error::No published PostgreSQL CI image matches deploy/postgres-ci; run Build images first'; exit 1; }
  bench:
    name: PostgreSQL, SQLite and in-browser latency and capacity
    needs: image
    # GitHub's runner, where the UI budgets are calibrated (docs/development.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    # PostgreSQL 16 with pgmp, the native build tools, Rust and the browsers, so nothing is
    # installed from Ubuntu's mirrors and no pgmp is built.
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    env:
      # Chromium will not start as root with another user's home.
      HOME: /root
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGUSER: rational_test
      PGDATABASE: rational_app
      PGDATA: /tmp/openchronology-postgres
      OCH_POSTGRES_LOG: /tmp/openchronology-postgres.log
      BENCH_DATABASE_URL: postgresql://rational_test@127.0.0.1:5433/rational_app
      BENCH_SIZES: ${{ inputs.sizes }}
      BENCH_TIME: ${{ inputs.time }}
      # Interaction benchmarks (bench/ui.mjs): include 4,000, the browser's comfortable size.
      UI_SIZES: 1000,4000,10000,100000,200000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # PostgreSQL 16 with pgmp, as postgres, from the image (deploy/postgres-ci/och-ci-postgres).
      - name: Start an isolated PostgreSQL instance
        run: och-ci-postgres
      - run: node scripts/npm-ci.mjs
      # Capacity measurements run the editor in Chromium. Nothing to do while the image's
      # Playwright matches the package; downloads only the browser if not. Rust 1.99.0, for the
      # SQLite backend's benchmarks, is the image's.
      - run: npx playwright install chromium
        timeout-minutes: 5
      # The platform interaction runs drive the production Next.js server.
      - run: npm run build
      - run: npm run bench:seed
      - run: npm run bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-report
          path: bench/results/
          if-no-files-found: ignore
