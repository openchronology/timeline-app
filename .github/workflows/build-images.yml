name: Build images
# The server packages' tools images (#605): each .deb and .rpm target's native-tools and
# package-tools stages, built from their Dockerfiles by scripts/build-images.mjs, pushed to
# ghcr.io/openchronology/server-build under a tag that hashes the stage, and attested.
# server-packages.yml's builds start from them, so they don't depend on distribution mirrors.
# Built when the Dockerfiles or the targets change on main, weekly for security updates, and
# by hand.
on:
  push:
    branches: [main]
    paths:
      - deploy/debian-server/Dockerfile
      - deploy/rpm-server/Dockerfile
      - scripts/build-images.mjs
      - scripts/server-targets.mjs
      - .github/workflows/build-images.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-images
  cancel-in-progress: false
jobs:
  tools:
    name: ${{ matrix.target }} ${{ matrix.stage }}
    strategy:
      fail-fast: false
      matrix:
        target: [debian13, ubuntu24.04, rocky10, fedora44]
        stage: [native-tools, package-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Sign in to GitHub's container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image
        id: image
        timeout-minutes: 20
        env:
          # The runners' own Ubuntu mirror, as server-packages.yml uses.
          OCH_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: node scripts/build-images.mjs --push --stage "${{ matrix.stage }}" "${{ matrix.target }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
