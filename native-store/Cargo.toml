# The native store's crate: SQLite timeline files (.och) with exact rational times, used by the
# desktop app (src-tauri) and the server's och-convert.
[package]
name = "openchronology-store"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Athan Clark"]
build = "build.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false }

# Latency benchmarks for the SQLite backend; see docs/benchmarks.md.
[[bench]]
name = "backends"
harness = false
