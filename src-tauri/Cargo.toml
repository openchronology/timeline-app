# The desktop app's crate: the Tauri shell, its dialog plugin, the native store
# (../native-store) and an HTTP client for servers.
[package]
name = "openchronology-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "An exact rational timeline editor with offline SQLite files"
authors = ["Athan Clark"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
openchronology-store = { path = "../native-store" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
